# Site settings. Most day-to-day content lives in the Markdown pages,
# _data/, _coaches/ and _notices/ - see EDITING.md.
title: Hampden Park Tennis Club
description: A friendly tennis club in Hampden Park, Eastbourne with five floodlit courts, coaching and teams for all levels.
url: "https://hampdenparktennis.co.uk"
baseurl: ""

markdown: kramdown
permalink: pretty

collections:
  coaches:
    output: false
  notices:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
  # Page structure lives here (not in the pages) so the web editor can't remove it.
  - scope: { path: "index.md" }
    values: { layout: home }
  - scope: { path: "teams.md" }
    values: { permalink: /matches/ }
  - scope: { path: "sessions.md" }
    values: { extras: [sessions] }
  - scope: { path: "coaching.md" }
    values: { extras: [coaches] }
  - scope: { path: "membership.md" }
    values: { extras: [fees] }
  - scope: { path: "events.md" }
    values: { extras: [calendar] }
  - scope: { path: "contact.md" }
    values: { extras: [contact] }
exclude:
  - README.md
  - EDITING.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - temp
  - fb.zip
