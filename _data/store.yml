# Settings for the payment pages under /store/.
# A payment method only appears on the page once its details are filled in.

# SumUp payment link, e.g. https://pay.sumup.com/b2c/XXXXXXXX
# (SumUp app or dashboard > Payment links). Leave blank to hide the SumUp option.
sumup_link: ""

# Bank transfer details. Leave account_number blank to hide the bank option.
bank:
  account_name: ""
  sort_code: ""
  account_number: ""

# Web app address of the Google Apps Script that records each payment request
# in the Google Sheet (see README.md, "Payment pages"). Ends in /exec.
sheet_script_url: ""
