<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/images/HP-Logo.gif' | relative_url }}" alt="{{ site.data.club.name }}" width="180" height="52">
    </a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {% for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
        <li><a class="button small" href="{{ site.data.club.clubspark.booking }}">Book a court</a></li>
      </ul>
    </nav>
  </div>
</header>
