<section class="hero" style="background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('{{ page.hero.image | relative_url }}')">
  <div class="container hero-inner">
    <h1>{{ page.hero.title }}</h1>
    <p>{{ page.hero.text }}</p>
    <p class="actions">
      <a class="button" href="{{ site.data.club.clubspark.join }}">Join the club</a>
      <a class="button secondary" href="{{ site.data.club.clubspark.booking }}">Book a court</a>
    </p>
  </div>
</section>
